<!doctype html>

    <link href="/sass/styles.scss" rel="stylesheet" />

          <div class="floor__section floor__section--teal floor__section--2">

            <div class="face face-back"></div>
            <div class="face face-left"></div>

            <div class="face face-left"></div>
            <div class="face face-right"></div>
          </div>
          <div class="floor__grass">
            <div class="face face-top"></div>
            <div class="face face-bottom"></div>
            <div class="face face-front"></div>
            <div class="face face-back"></div>
            <div class="face face-left"></div>
            <div class="face face-right"></div>
          </div>
        </div>

        <div class="rope rope--left">
          <div class="rope__face"></div>

        <div class="rope rope--right">

        </div>

        <div class="wall wall--back">

          <div class="face face-left"></div>
          <div class="face face-right"></div>

          <div class="face face-back"></div>

          <div class="face face-right"></div>

          <div class="face face-bottom"></div>
